<html
    lang="en"
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/Fluid/ViewHelpers"
>

<f:asset.script
    identifier="ckeditor"
    src="https://cdn.ckeditor.com/4.22.1/standard/ckeditor.js"
    defer="1"
/>
<f:asset.script
    identifier="frontend-editor"
    src="EXT:academic_jobs/Resources/Public/JavaScript/frontend/ckeditor.js"
    defer="1"
/>

<div class="academic-jobs-new">

    <f:if condition="{settings.renderContentElementHeader}">
        <f:render partial="Header/All" arguments="{_all}" />
    </f:if>

    <f:comment>
        The confirmation after a saved job for a visitor who returns to the form, queued by
        the controller as JobController::CONFIRMATION_QUEUE_IDENTIFIER. A redirect page gets
        the confirmation in the queue of the plugin instead.
    </f:comment>
    <f:flashMessages queueIdentifier="academic_jobs.new_job_form.confirmation" />

    <f:render
        partial="Job/Forms/Errors"
        arguments="{
            object: job,
            validationResults: validationResults
        }"
    />

    <f:form
        action="create"
        name="job"
        object="{job}"
        enctype="multipart/form-data"
    >
        <f:render
            partial="Job/Properties/Job"
            arguments="{_all}"
        />

        <button class="btn btn-primary" type="submit">
            {f:translate(key: 'jobs.submit', extensionName: 'AcademicJobs')}
        </button>
    </f:form>
</div>

</html>
