<html
    lang="en"
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/Fluid/ViewHelpers"
>

<div class="academic-jobs-detail">

    <f:if condition="{settings.renderContentElementHeader}">
        <f:render partial="Header/All" arguments="{_all}" />
    </f:if>

    <f:flashMessages />

    <f:if condition="{settings.listPid}">
        <f:link.page class="ace-link" pageUid="{settings.listPid}">
            {f:translate(key: 'jobs.back', extensionName: 'AcademicJobs')}
        </f:link.page>
    </f:if>

    <f:if condition="{job}">
        <f:render
            partial="Job/Header"
            arguments="{
                header: job.title,
                layout: data.header_layout,
                subheader: data.subheader,
                detail: 'true',
            }"
        />

        <f:render
            partial="Job/Information"
            arguments="{
                job: job,
            }"
        />

        <f:variable name="contact" value="{f:if(condition: '{job.contactName} || {job.contactEmail} || {job.contactPhone}', then: 1, else: 0)}"/>

        <f:if condition="{job.description} || {contact}">
            <div class="row">
                <f:if condition="{job.description}">
                    <div class="col-12 {f:if(condition: contact, then: 'col-lg-8')}">
                        <div class="ce-bodytext">
                            <f:format.html>{job.description}</f:format.html>
                        </div>
                    </div>
                </f:if>

                <f:if condition="{contact}">
                    <div class="col-12 col-lg-4">
                        <f:render
                            partial="Job/Contact"
                            arguments="{
                                job: job,
                                data: data,
                            }"
                        />
                    </div>
                </f:if>
            </div>
        </f:if>
    </f:if>
</div>

</html>
