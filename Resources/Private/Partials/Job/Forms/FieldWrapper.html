<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:comment>
    The label, the required mark, the validation state and the help text around
    every field of the new-job form, rendered by the shared partial
    "Academic/Form/FieldWrapper" of EXT:academic_base. A project overrides this
    name. Its arguments are "element", "elementId", "class" and "elementContent".
</f:comment>

<f:render
    partial="Academic/Form/FieldWrapper"
    arguments="{
        element: element,
        elementId: elementId,
        class: class,
        elementContent: elementContent,
        extensionName: 'AcademicJobs',
    }"
/>

</html>
