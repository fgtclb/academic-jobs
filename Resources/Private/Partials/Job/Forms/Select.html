
<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:variable name="elementId" value="job.{element.identifier}"/>
<f:form.validationResults for="{elementId}" as="fieldValidationResults">
    <f:if condition="{fieldValidationResults.flattenedErrors}">
        <f:variable name="fieldAria" value="{invalid: 'true', describedby: '{elementId}-error'}"/>
    </f:if>
</f:form.validationResults>

<f:render
    partial="Job/Forms/FieldWrapper"
    arguments="{element: element, elementId: elementId, class: 'form-select-wrap'}"
    contentAs="elementContent"
>
    <f:form.select
        property="{element.identifier}"
        id="{elementId}"
        class="form-select"
        errorClass="is-invalid"
        aria="{fieldAria}"
        options="{element.options}"
        optionValueField="{element.optionValueField}"
        optionLabelField="{element.optionLabelField}"
        prependOptionValue="{element.prependOptionValue}"
        prependOptionLabel="{element.prependOptionLabel}"
        disabled="{disabled}"
    />
</f:render>

</html>
