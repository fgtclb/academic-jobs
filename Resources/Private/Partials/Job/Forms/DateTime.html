<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:variable name="elementId" value="job.{element.identifier}"/>
<f:form.validationResults for="{elementId}" as="fieldValidationResults">
    <f:if condition="{fieldValidationResults.flattenedErrors}">
        <f:variable name="fieldAria" value="{invalid: 'true', describedby: '{elementId}-error'}"/>
    </f:if>
</f:form.validationResults>

<f:render
    partial="Job/Forms/FieldWrapper"
    arguments="{element: element, elementId: elementId, class: 'form-date-wrap'}"
    contentAs="elementContent"
>
    <f:form.textfield
        property="{element.identifier}"
        value="{element.value -> f:format.date(format:'Y-m-d')}"
        id="{elementId}"
        class="form-control"
        errorClass="is-invalid"
        aria="{fieldAria}"
        disabled="{element.disabled}"
        data="{render:'datepicker'}"
        type="date"
    />
</f:render>

</html>
