# Site settings of the shared "plugin.tx_academicjobs" block.
#
# Every path below is also assigned in
# "Configuration/TypoScript/constants.typoscript", and the default has to be the
# same in both files: a site that uses the site set and the static template
# reads the constants after the site settings, so a differing default resets
# what the integrator configured, silently. Four of them used to differ - the
# constants left the four page id settings empty while the declarations below
# default them to 0. Both are read as page id 0 by every consumer of them, so
# the constants now say 0 as well.
#
# The file is declared with the aggregate set only - see "config.yaml" next to
# it for what that means for a site that depends on a single component.
categories:
  academic:
    label: 'Academic'
  academic.jobs:
    label: 'Jobs'
    parent: academic

settings:
  plugin.tx_academicjobs.persistence.storagePid:
    label: 'Default storage PID'
    category: academic.jobs
    type: int
    default: 0
  plugin.tx_academicjobs.detailPid:
    label: 'Default detail page PID'
    category: academic.jobs
    type: int
    default: 0
  plugin.tx_academicjobs.listPid:
    label: 'Default list page PID'
    category: academic.jobs
    type: int
    default: 0
  plugin.tx_academicjobs.email.from:
    label: 'Sender email address'
    category: academic.jobs
    type: string
    default: ''
  plugin.tx_academicjobs.email.recipientEmail:
    label: 'Recipient email address'
    category: academic.jobs
    type: string
    default: ''
  plugin.tx_academicjobs.email.subject:
    label: 'Email subject'
    category: academic.jobs
    type: string
    default: 'New job application'
  plugin.tx_academicjobs.email.template:
    label: 'Email content'
    category: academic.jobs
    type: string
    default: 'A new job application has been submitted. Please check the backend.'
  plugin.tx_academicjobs.saveForm.fallbackRedirectPageId:
    label: 'Default redirect page PID, can be overruled in plugin'
    category: academic.jobs
    type: int
    default: 0
  plugin.tx_academicjobs.saveForm.fallbackFlashMessageCreationMode:
    label: 'Flash message creation mode'
    category: academic.jobs
    type: int
    default: 0
  plugin.tx_academicjobs.jobAvatarImage.uploadFolder:
    label: 'An upload folder'
    category: academic.jobs
    type: string
    default: '1:/global-content/jobs/logos/'
  plugin.tx_academicjobs.jobAvatarImage.validation.fileSize.maximum:
    label: 'The maximum file size to accept'
    category: academic.jobs
    type: string
    default: '2M'
  plugin.tx_academicjobs.jobAvatarImage.validation.mimeType.allowedMimeTypes:
    label: 'Allowed mime types (using */* IANA media types)'
    category: academic.jobs
    type: string
    default: 'image/jpeg,image/png,image/webp,image/svg+xml'
