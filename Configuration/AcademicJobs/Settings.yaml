#-----------------------------------------------------------------------------------------------------------------------
# EXT:academic_jobs - Field validation configuration of a job.
#
# Read by the shared settings classes of EXT:academic_base, the same ones EXT:academic_persons uses. The flags of a
# field apply in three places: the frontend "new job" form, the check of a submitted job, and the TYPO3 backend record
# editor of a job.
#
# Documented at:
# https://docs.typo3.org/p/fgtclb/academic-jobs/main/en-us/Configuration/Validations/Index.html
#-----------------------------------------------------------------------------------------------------------------------
# The same file of every active package is merged in package loading order. A package names only the fields it
# changes: a list replaces the flags of that field, an empty list `[]` drops them, and `~` removes the field.
#
# <identifier>:
#   <propertyName>:
#      - required   # must not be empty: marked in the form, checked on submit, required in the backend
#      - readonly   # read only in the backend and not required anywhere, the form keeps offering the field
#      - disabled   # the same as readonly
#      - frontendreadonly # not required in the form and on submit, the backend keeps what the other flags say
#      - email      # must be an e-mail address: an e-mail input, an `email` column in the backend
#      - url        # must be a URL: a URL input
#      - number     # a number input and a `number` column in the backend, NOT checked on submit
#      - tel        # a telephone input, nothing else
#      - date       # a date input on a text field, nothing else
#
# Flags are read regardless of case. A flag outside the vocabulary of EXT:academic_persons is ignored, and `textarea`
# and `html` do not belong in this file.
#-----------------------------------------------------------------------------------------------------------------------
validations:
  job:
    title:
      - required
    employmentType:
      - required
    type:
      - required
    companyName:
      - required
    employmentStartDate:
      - required
    description:
      - required
    link:
      - url
    contactEmail:
      - email
    contactPhone:
      - tel
