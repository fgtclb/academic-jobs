services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  TESTS\TestJobAfterSaveListener\:
    resource: '../Classes/*'

  # Registered by tag, because TYPO3 v12 has no #[AsEventListener] attribute. The event
  # is read from the parameter of __invoke().
  TESTS\TestJobAfterSaveListener\EventListener\SetRedirectPage:
    tags:
      - name: event.listener
        identifier: 'test-job-after-save-listener/set-redirect-page'

  TESTS\TestJobAfterSaveListener\EventListener\RecordNewJobFormResponse:
    tags:
      - name: event.listener
        identifier: 'test-job-after-save-listener/record-new-job-form-response'
