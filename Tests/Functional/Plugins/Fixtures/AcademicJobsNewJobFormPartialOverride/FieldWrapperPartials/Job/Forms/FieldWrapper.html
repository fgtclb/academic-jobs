<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:p="http://typo3.org/ns/FGTCLB/AcademicBase/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:variable name="validation" value="{p:validationEnsure(validations: element.validations, identifier: element.identifier)}"/>

<f:form.validationResults for="{elementId}" as="validationResults">
    <div class="{f:if(condition:'{validationResults.flattenedErrors}', then:' is-invalid')} {class}" data-project="field-wrapper">
        <label class="form-label" for="{elementId}">
            {f:translate(key:'create.{elementId}.label', extensionName: 'AcademicJobs')}
            <f:if condition="{validation.required}">
                <abbr title="required">*</abbr>
            </f:if>
        </label>

        {elementContent->f:format.raw()}

        <f:if condition="{element.help}">
            <div class="form-text">{element.help->f:format.raw()}</div>
        </f:if>
    </div>
</f:form.validationResults>

</html>
