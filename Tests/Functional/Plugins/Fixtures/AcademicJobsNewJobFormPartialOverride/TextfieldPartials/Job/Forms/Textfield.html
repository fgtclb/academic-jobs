<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:p="http://typo3.org/ns/FGTCLB/AcademicBase/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:variable name="elementId" value="job.{element.identifier}"/>
<f:variable name="validation" value="{p:validationEnsure(validations: element.validations, identifier: element.identifier)}"/>

<f:render
    partial="Job/Forms/FieldWrapper"
    arguments="{element: element, elementId: elementId, class: 'form-textfield-wrap'}"
    contentAs="elementContent"
>
    <f:form.textfield
        type="{validation.inputType}"
        data="{project: 'textfield'}"
        property="{element.identifier}"
        id="{elementId}"
        placeholder="{f:translate(key:'edit.{elementId}.placeholder', extensionName: 'AcademicJobs')}"
        class="form-control"
        disabled="{element.disabled}"
        autocomplete="{element.autocomplete}"
    />
</f:render>

</html>
